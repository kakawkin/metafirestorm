<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>10 вариантов меню WeakAuras</title>
<style>
  body { background: #121212; color: #eee; font-family: sans-serif; margin: 0; padding: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 40px; }
  .menu-container { background: #1a1a1a; padding: 20px; border-radius: 8px; width: 250px; min-height: 400px; border: 1px solid #333; }
  .menu-container h2 { font-size: 16px; text-align: center; color: #aaa; margin-top: 0; margin-bottom: 20px; }
  
  /* Menu 1: Simple text with lines */
  .m1 .cat { font-size: 12px; text-transform: uppercase; color: #888; margin-top: 15px; margin-bottom: 5px; letter-spacing: 1px; }
  .m1 .item { padding: 8px 10px; cursor: pointer; color: #ccc; border-bottom: 1px solid #2a2a2a; transition: 0.2s; }
  .m1 .item:hover { color: #fff; background: #222; }
  .m1 .item.active { border-left: 3px solid #d4af37; color: #d4af37; background: #222; }

  /* Menu 2: Pills */
  .m2 .cat { font-weight: bold; margin-top: 15px; margin-bottom: 10px; color: #aaa; }
  .m2 .item { padding: 6px 12px; margin-bottom: 6px; cursor: pointer; border-radius: 20px; color: #bbb; transition: 0.2s; }
  .m2 .item:hover { background: #333; color: #fff; }
  .m2 .item.active { background: #d4af37; color: #000; font-weight: bold; }

  /* Menu 3: Folder style */
  .m3 .cat { font-size: 14px; font-weight: 600; color: #eee; margin-top: 15px; padding: 5px; background: #2a2a2a; border-radius: 4px; }
  .m3 .items { padding-left: 15px; border-left: 1px solid #333; margin-left: 10px; margin-top: 5px; }
  .m3 .item { padding: 5px 0; cursor: pointer; color: #aaa; font-size: 14px; }
  .m3 .item:before { content: "- "; }
  .m3 .item:hover { color: #d4af37; }
  .m3 .item.active { color: #d4af37; font-weight: bold; }

  /* Menu 4: Classic sidebar dark */
  .m4 .cat { font-size: 11px; text-transform: uppercase; color: #777; margin: 15px 0 5px 15px; }
  .m4 .item { padding: 10px 15px; cursor: pointer; border-radius: 6px; margin-bottom: 2px; color: #bbb; display: flex; align-items: center; }
  .m4 .item:hover { background: rgba(255,255,255,0.05); }
  .m4 .item.active { background: rgba(212, 175, 55, 0.15); color: #d4af37; }

  /* Menu 5: Minimalist dots */
  .m5 .cat { font-size: 18px; font-family: serif; color: #d4af37; margin: 20px 0 10px 0; border-bottom: 1px dotted #444; padding-bottom: 5px; }
  .m5 .item { padding: 5px 0; cursor: pointer; color: #999; display: flex; align-items: center; gap: 8px; }
  .m5 .item:before { content: ""; width: 6px; height: 6px; background: #444; border-radius: 50%; }
  .m5 .item:hover { color: #eee; }
  .m5 .item.active { color: #eee; }
  .m5 .item.active:before { background: #d4af37; box-shadow: 0 0 5px #d4af37; }

  /* Menu 6: Cards */
  .m6 .cat { font-size: 13px; color: #666; margin-top: 15px; margin-bottom: 5px; }
  .m6 .item { padding: 10px; cursor: pointer; background: #222; margin-bottom: 8px; border-radius: 4px; border: 1px solid #333; color: #ccc; }
  .m6 .item:hover { border-color: #555; }
  .m6 .item.active { border-color: #d4af37; background: #2a251a; color: #d4af37; }

  /* Menu 7: Indented with icons */
  .m7 .cat { color: #fff; margin-top: 15px; margin-bottom: 10px; font-weight: bold; }
  .m7 .item { padding: 8px 10px 8px 25px; cursor: pointer; color: #888; position: relative; }
  .m7 .item:hover { color: #fff; }
  .m7 .item.active { color: #d4af37; background: #222; border-radius: 4px; }
  .m7 .item.active:before { content: "›"; position: absolute; left: 10px; color: #d4af37; }

  /* Menu 8: Warcraft style */
  .m8 { border: 2px solid #3a3a3a; background: #111 url('background.png') center/cover; position: relative; }
  .m8 .cat { color: #f8b700; font-family: "Cinzel", serif; text-align: center; margin: 15px 0 5px; border-bottom: 1px solid #3a3a3a; padding-bottom: 5px;}
  .m8 .item { padding: 8px; text-align: center; color: #ccc; cursor: pointer; text-shadow: 1px 1px 2px #000; }
  .m8 .item:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .m8 .item.active { color: #fff; background: rgba(248,183,0,0.2); border: 1px solid #f8b700; border-radius: 4px;}

  /* Menu 9: Blocky headers */
  .m9 .cat { background: #333; padding: 8px; color: #fff; font-size: 12px; letter-spacing: 1px; margin-top: 10px; }
  .m9 .item { padding: 10px; background: #252525; border-bottom: 1px solid #1a1a1a; color: #aaa; cursor: pointer; }
  .m9 .item:hover { background: #2a2a2a; }
  .m9 .item.active { background: #d4af37; color: #000; font-weight: bold; }

  /* Menu 10: Hover reveal */
  .m10 .cat { font-size: 15px; color: #eee; margin-top: 20px; margin-bottom: 5px; opacity: 0.8; }
  .m10 .item { padding: 6px 0; color: #777; cursor: pointer; transform: translateX(0); transition: 0.3s; }
  .m10 .item:hover { color: #ccc; transform: translateX(5px); }
  .m10 .item.active { color: #d4af37; transform: translateX(10px); }
</style>
</head>
<body>
  <h1 style="text-align: center; color: #d4af37;">Варианты бокового меню WeakAuras</h1>
  <div class="grid">
    <script>
      const categories = [
        { name: 'Мифик+', items: ['Общие для ключей', 'Аффиксы', 'Роуты'] },
        { name: 'Классы', items: ['Рыцарь смерти', 'Маг', 'Друид'] },
        { name: 'Рейд', items: ['Боссы', 'Общие рейдовые'] }
      ];

      for (let i = 1; i <= 10; i++) {
        document.write(`<div class="menu-container m${i}">`);
        document.write(`<h2>Вариант ${i}</h2>`);
        categories.forEach((cat, cIdx) => {
          document.write(`<div class="cat">${cat.name}</div>`);
          if(i===3) document.write(`<div class="items">`);
          cat.items.forEach((item, jIdx) => {
            const activeClass = (cIdx === 0 && jIdx === 0) ? ' active' : '';
            document.write(`<div class="item${activeClass}">${item}</div>`);
          });
          if(i===3) document.write(`</div>`);
        });
        document.write('</div>');
      }
    </script>
  </div>
</body>
</html>
